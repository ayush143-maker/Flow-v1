name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build app-debug.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore debug keystore (stable signature across runs)
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flow-debug-keystore-v1

      - name: Generate debug keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build web app (type-check + bundle)
        run: npm run build

      - name: Generate Android project from Capacitor template
        run: npx cap add android

      - name: Apply Flow native overlay (Kotlin engine, manifest, branding)
        run: node android-overlay/apply.mjs

      - name: Generate launcher & splash assets
        run: npm run icons

      - name: Sync web build & plugins into Android
        run: npx cap sync android

      - name: Accept Android SDK licenses / ensure components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null || true

      - name: Run Kotlin unit tests (parser suite)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
